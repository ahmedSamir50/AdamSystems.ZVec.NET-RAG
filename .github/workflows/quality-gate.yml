name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ZVec.NET-RAG.slnx

      - name: Build
        run: dotnet build ZVec.NET-RAG.slnx --configuration Release --no-restore

      - name: Verify Formatting
        run: dotnet format ZVec.NET-RAG.slnx --verify-no-changes --verbosity diagnostic

      - name: Run Tests
        shell: bash
        run: |
          ./tests/ZVec.Extensions.VectorData.Tests/bin/Release/net8.0/ZVec.Extensions.VectorData.Tests
          ./tests/ZVec.Extensions.VectorData.ConformanceTests/bin/Release/net8.0/ZVec.Extensions.VectorData.ConformanceTests
          ./tests/ZVec.Extensions.VectorData.SourceGenerator.Tests/bin/Release/net8.0/ZVec.Extensions.VectorData.SourceGenerator.Tests
          ./tests/ZVec.Rag.Tests/bin/Release/net8.0/ZVec.Rag.Tests
          ./tests/ZVec.Rag.Pdf.Tests/bin/Release/net8.0/ZVec.Rag.Pdf.Tests
          ./tests/ZVec.Rag.LLamaSharp.Tests/bin/Release/net8.0/ZVec.Rag.LLamaSharp.Tests
          ./tests/ZVec.Rag.ONNX.Tests/bin/Release/net8.0/ZVec.Rag.ONNX.Tests

      - name: Run Sample 01
        run: dotnet run --project samples/01-rag-your-docs/ZVec.Rag.Sample01.csproj -c Release --no-build -f net8.0

      - name: Run Sample 03 desktop-index
        run: dotnet run --project samples/03-offline-phone-rag/desktop-index/ZVec.Rag.Sample03.DesktopIndex.csproj -c Release --no-build -f net8.0

      - name: Check Class Line Count Limit
        run: |
          violations=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "FAIL: $file has $lines lines (limit 500)"
              violations=1
            fi
          done < <(find src -name '*.cs')
          exit $violations

      - name: Detect Dummy Tests
        run: |
          if rg 'Assert\.True\(true\)|Assert\.True\(false\)' tests/; then
            echo "Dummy tests detected"
            exit 1
          fi

      - name: Plan Alignment Check
        run: python3 .agents/gaps/plan_alignment_check.py

      - name: Pack Shipping NuGet Packages
        run: |
          dotnet pack src/ZVec.Extensions.VectorData/ZVec.Extensions.VectorData.csproj -c Release --no-build
          dotnet pack src/ZVec.Rag/ZVec.Rag.csproj -c Release --no-build
          dotnet pack src/ZVec.Rag.Pdf/ZVec.Rag.Pdf.csproj -c Release --no-build
          dotnet pack src/ZVec.Rag.Template/ZVec.Rag.Template.csproj -c Release --no-build
          dotnet pack src/ZVec.Rag.Testing/ZVec.Rag.Testing.csproj -c Release --no-build
          dotnet pack src/ZVec.Rag.LLamaSharp/ZVec.Rag.LLamaSharp.csproj -c Release --no-build
          dotnet pack src/ZVec.Rag.ONNX/ZVec.Rag.ONNX.csproj -c Release --no-build

  template-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack local NuGet artifacts
        run: |
          dotnet pack src/ZVec.Extensions.VectorData/ZVec.Extensions.VectorData.csproj -c Release -o ./artifacts
          dotnet pack src/ZVec.Rag/ZVec.Rag.csproj -c Release -o ./artifacts
          dotnet pack src/ZVec.Rag.Testing/ZVec.Rag.Testing.csproj -c Release -o ./artifacts
          dotnet pack src/ZVec.Rag.Template/ZVec.Rag.Template.csproj -c Release -o ./artifacts
          dotnet pack src/ZVec.Rag.LLamaSharp/ZVec.Rag.LLamaSharp.csproj -c Release -o ./artifacts
          dotnet pack src/ZVec.Rag.ONNX/ZVec.Rag.ONNX.csproj -c Release -o ./artifacts

      - name: Install template and scaffold
        run: |
          mkdir -p "$RUNNER_TEMP/template-smoke"
          cd "$RUNNER_TEMP/template-smoke"
          dotnet new install "$GITHUB_WORKSPACE/artifacts/ZVec.Rag.Template.1.0.0-preview.1.nupkg"
          dotnet new zvec-rag -n TmpRag --llm fake --embedder fake -o ./TmpRag
          dotnet restore ./TmpRag/TmpRag.csproj --source https://api.nuget.org/v3/index.json --source "$GITHUB_WORKSPACE/artifacts"
          dotnet run --project ./TmpRag/TmpRag.csproj -f net8.0 --no-restore
          dotnet new zvec-rag-aspnet -n TmpAsp --llm fake --embedder fake -o ./TmpAsp
          dotnet restore ./TmpAsp/TmpAsp.csproj --source https://api.nuget.org/v3/index.json --source "$GITHUB_WORKSPACE/artifacts"
          dotnet build ./TmpAsp/TmpAsp.csproj --no-restore
          dotnet new zvec-rag -n TmpOnnx --llm fake --embedder onnx -o ./TmpOnnx
          dotnet restore ./TmpOnnx/TmpOnnx.csproj --source https://api.nuget.org/v3/index.json --source "$GITHUB_WORKSPACE/artifacts"
          dotnet run --project ./TmpOnnx/TmpOnnx.csproj -f net8.0 --no-restore
          dotnet new zvec-rag-aspnet -n TmpLlama --llm llamasharp --embedder fake -o ./TmpLlama
          dotnet restore ./TmpLlama/TmpLlama.csproj --source https://api.nuget.org/v3/index.json --source "$GITHUB_WORKSPACE/artifacts"
          dotnet build ./TmpLlama/TmpLlama.csproj --no-restore

  rag-aot-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish RAG AOT Harness
        shell: bash
        run: dotnet publish tests/ZVec.Rag.AotTestApp/ZVec.Rag.AotTestApp.csproj -c Release -r ${{ matrix.rid }} /p:PublishAot=true /p:TrimmerSingleWarn=false 2>&1 | tee rag-aot-publish.log

      - name: Verify RAG AOT Trim Warnings
        shell: bash
        run: |
          if rg "IL2026|IL3050" rag-aot-publish.log; then
            echo "FAIL: RAG AOT publish emitted IL2026/IL3050 trim warnings"
            exit 1
          fi

      - name: Run RAG AOT Harness
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./tests/ZVec.Rag.AotTestApp/bin/Release/net8.0/${{ matrix.rid }}/publish/ZVec.Rag.AotTestApp.exe
          else
            ./tests/ZVec.Rag.AotTestApp/bin/Release/net8.0/${{ matrix.rid }}/publish/ZVec.Rag.AotTestApp
          fi

  aot-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish AOT Smoke App
        run: dotnet publish tests/ZVec.AotTestApp/ZVec.AotTestApp.csproj -c Release -r ${{ matrix.rid }} /p:PublishAot=true

      - name: Run AOT Smoke App
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./tests/ZVec.AotTestApp/bin/Release/net8.0/${{ matrix.rid }}/publish/ZVec.AotTestApp.exe
          else
            ./tests/ZVec.AotTestApp/bin/Release/net8.0/${{ matrix.rid }}/publish/ZVec.AotTestApp
          fi

  trim-warning-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Trim Smoke App
        run: dotnet publish tests/ZVec.AotTestApp/ZVec.AotTestApp.csproj -c Release -r linux-x64 /p:PublishAot=true /p:TrimmerSingleWarn=false 2>&1 | tee publish.log

      - name: Verify Non-SG Trim Warning
        run: rg "IL2026|IL3050|ReflectionFallbackRecord" publish.log
